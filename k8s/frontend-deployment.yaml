apiVersion: apps/v1
kind: Deployment

metadata:
  name: rag-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: rag-frontend

  template:
    metadata:
      labels:
        app: rag-frontend

    spec:
      containers:
      - name: rag-frontend
        image: yourdockerhub/rag-frontend:latest

        ports:
        - containerPort: 3000

---

apiVersion: v1
kind: Service

metadata:
  name: rag-frontend-service

spec:
  selector:
    app: rag-frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000

  type: LoadBalancer