apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: rag-ingress

spec:
  rules:

  - host: rag.local

    http:
      paths:

      - path: /
        pathType: Prefix

        backend:
          service:
            name: rag-frontend-service

            port:
              number: 80

      - path: /api
        pathType: Prefix

        backend:
          service:
            name: rag-backend-service

            port:
              number: 8000