apiVersion: apps/v1
kind: Deployment

metadata:
  name: rag-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: rag-backend

  template:
    metadata:
      labels:
        app: rag-backend

    spec:
      containers:
      - name: rag-backend
        image: yourdockerhub/rag-backend:latest

        ports:
        - containerPort: 8000

---

apiVersion: v1
kind: Service

metadata:
  name: rag-backend-service

spec:
  selector:
    app: rag-backend

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

  type: ClusterIP